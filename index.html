<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style> 
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        padding: 60px 24px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        font-family: "Poppins", sans-serif;
        background:
            radial-gradient(circle at 15% 20%, #312e8166, transparent 40%),
            radial-gradient(circle at 85% 80%, #0891b244, transparent 40%),
            #0b1020;
        color: white;
    }

    body::before {
        content: "AMRAM'S WEB PROJECTS";
        margin-bottom: 12px;
        font-size: clamp(24px, 5vw, 42px);
        font-weight: 700;
        letter-spacing: 2px;
        text-align: center;
        color: #e2e8f0;
    }

    a {
        position: relative;
        width: min(100%, 520px);
        padding: 24px 30px;
        border: 1px solid #ffffff26;
        border-radius: 18px;
        background: #ffffff08;
        color: #e2e8f0;
        text-decoration: none;
        font-size: clamp(18px, 3vw, 23px);
        font-weight: 600;
        backdrop-filter: blur(12px);
        box-shadow: 0 12px 30px #00000030;
        transition:
            transform 0.3s ease,
            background 0.3s ease,
            border-color 0.3s ease,
            box-shadow 0.3s ease;
    }

    a::after {
        content: "↗";
        position: absolute;
        right: 28px;
        color: #67e8f9;
        transition: transform 0.3s ease;
    }

    a:hover {
        transform: translateY(-5px);
        background: #ffffff12;
        border-color: #67e8f9;
        box-shadow: 0 15px 35px #06b6d425;
    }

    a:hover::after {
        transform: translate(3px, -3px);
    }

    a:focus-visible {
        outline: 3px solid #67e8f9;
        outline-offset: 5px;
    }

    @media (max-width: 480px) {
        body {
            padding: 40px 20px;
        }

        a {
            padding: 20px 24px;
        }
    }

    @media (prefers-reduced-motion: reduce) {
        a,
        a::after {
            transition: none;
        }
    }
    </style>

</head>
<body>
    <a href="alvey/">Alvey Practice</a>
    <a href="mission/">Mission Statement</a>
    <a href="sandbox/">Sandbox</a>
    <a href="coolpics/">Cool Pics</a>
    <a href="ResponsiveDesign/">Responsive Design</a>  
</body>
</html>
