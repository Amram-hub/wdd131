<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Find hikes by name, description, or tag and compare their distances and difficulty.">
  <title>Hike Finder | Filtering and Sorting</title>
  <link rel="stylesheet" href="styles.css">
  <script src="hikes.js" defer></script>
</head>
<body>
  <header>
    <p>WDD 131 · Filtering and Sorting</p>
    <h1>Hike Finder</h1>
    <p>Find your next trail.</p>
  </header>
  <main>
    <form id="search-form" role="search">
      <label for="search">Search hikes</label>
      <div class="search-controls">
        <input id="search" type="search" placeholder="Try waterfall, canyon, or volcanic">
        <button type="submit">Search</button>
      </div>
      <p>Search names, descriptions, and tags. Results are sorted by distance.</p>
    </form>
    <p id="results-status" role="status"></p>
    <div id="hike-container"></div>
  </main>
  <footer>WDD 131 · Hike Finder</footer>
</body>
</html>
