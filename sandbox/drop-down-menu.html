<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="drop-down-menu.js" defer></script>
    <style> 
        nav > ul {
            display: flex;
            list-style: none;
            padding-left: 0;
            gap: 1rem;
        }

        .sub-menu {
            display: none;
            position: absolute;
            list-style: none;
            padding-left: 0;
        }
    </style>
</head>
<body>
    <header>
        <h1>Menu Demo</h1>
        <nav>
            <ul>

                <li><a href="#">Link1</a></li>
                     <ul class="sub-menu">
                        <li><a href="#">Sub1</a></li>
                        <li><a href="#">Sub2</a></li>
                        <li><a href="#">Sub3</a></li>
                        <li><a href="#">Sub4</a></li>
                     </ul>
                
                <li><a href="#">Link2</a></li>
                <li><a href="#">Link3</a></li>
                <li><a href="#">Link4</a></li>
            </ul>
        </nav> 
    </header>
    <input type="text" placeholder="Search...">
</body>
</html>
