<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Register for an event and create your ticket.">
  <title>Event Ticket</title>

  <link
    rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%23bad0db'/%3E%3Ctext x='32' y='46' text-anchor='middle' font-size='44'%3ET%3C/text%3E%3C/svg%3E"
  >

  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>

<body>
  <main class="card">
    <h1>Event Ticket</h1>

    <form id="ticketForm" novalidate>
      <div class="field">
        <label for="firstName">First Name</label>
        <input
          id="firstName"
          name="firstName"
          type="text"
          autocomplete="given-name"
          required
        >
      </div>

      <div class="field">
        <label for="lastName">Last Name</label>
        <input
          id="lastName"
          name="lastName"
          type="text"
          autocomplete="family-name"
          required
        >
      </div>

      <div class="field full">
        <label for="email">Email</label>
        <input
          id="email"
          name="email"
          type="email"
          autocomplete="email"
          required
        >
      </div>

      <div class="field">
        <label for="type">Type</label>
        <select
          id="type"
          name="type"
          aria-controls="extraField"
          required
        >
          <option value="">Choose one</option>
          <option value="student">Student</option>
          <option value="guest">Guest</option>
        </select>
      </div>

      <div class="field">
        <label for="eventDate">Event Date</label>
        <input
          id="eventDate"
          name="eventDate"
          type="date"
          required
        >
      </div>

      <div id="extraField" class="field full" hidden>
        <label id="credentialLabel" for="credential">Student I#</label>
        <input
          id="credential"
          name="credential"
          type="text"
          aria-describedby="credentialHint"
          required
          disabled
        >
        <small id="credentialHint"></small>
      </div>

      <button class="full" type="submit">Create Ticket</button>
    </form>

    <div id="errors" role="alert" aria-atomic="true"></div>

    <section
      id="ticket"
      aria-live="polite"
      aria-atomic="true"
      hidden
    ></section>
  </main>
</body>
</html>
