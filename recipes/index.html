<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Find your next favorite recipe. Search recipes by name, description, or tags.">
  <meta name="author" content="Amram Avegnon">
  <title>RecipeBook | Find something delicious</title>
  <link rel="stylesheet" href="styles.css">
  <script src="recipes.js" defer></script>
  <script src="main.js" defer></script>
</head>
<body>
  <header><h1><img class="logo" src="images/recipe-book.png" alt="" width="80" height="80"> RecipeBook</h1></header>
  <main>
    <form id="search-form" role="search">
      <label class="visually-hidden" for="search">Search recipes</label>
      <input type="search" id="search" placeholder="Find a recipe" autocomplete="off">
      <button type="submit" aria-label="Search recipes">Search <span aria-hidden="true">⌕</span></button>
    </form>
    <p id="results-message" role="status" aria-live="polite"></p>
    <section id="recipe-list" aria-label="Recipes"></section>
    <noscript>Please enable JavaScript to view and search the recipes.</noscript>
  </main>
  <footer><p>RecipeBook · A little inspiration for your kitchen</p><a href="https://www.flaticon.com/free-icons/recipe">Recipe icons created by Freepik - Flaticon</a></footer>
</body>
</html>
